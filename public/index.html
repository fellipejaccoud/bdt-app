<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>BDT Digital — INEA/DIRSUP</title>
</head>
<body>
<div id="bdt-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  #bdt-root {
    --ink: #1c1d17;
    --paper: #f2f0e6;
    --paper-raised: #ffffff;
    --forest: #1c3829;
    --forest-deep: #122419;
    --gold: #b98a2e;
    --gold-soft: #e7d3a4;
    --brick: #a8412a;
    --line: #d8d3c2;
    --ok: #3c6b45;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--paper);
    max-width: 460px;
    margin: 0 auto;
    min-height: 100%;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
  }

  #bdt-root * { box-sizing: border-box; }
  #bdt-root .display { font-family: 'Zilla Slab', Georgia, serif; }
  #bdt-root .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }

  #bdt-root .topbar {
    background: var(--forest);
    color: var(--gold-soft);
    padding: 18px 20px 16px;
    border-bottom: 4px solid var(--gold);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  #bdt-root .topbar .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 2px; font-weight: 600; }
  #bdt-root .topbar h1 { font-size: 21px; margin: 0; color: #fff; font-weight: 600; }
  #bdt-root .topbar .sub { font-size: 12.5px; color: #cfd9cf; margin-top: 3px; }

  #bdt-root .content { padding: 16px; }

  #bdt-root .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 0 rgba(28,24,17,0.03);
  }
  #bdt-root .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--forest); margin: 0 0 12px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  #bdt-root .card h2::before { content: ''; width: 3px; height: 13px; background: var(--gold); display: inline-block; }

  #bdt-root label { display: block; font-size: 11.5px; color: #6b6a5e; margin-bottom: 4px; margin-top: 10px; font-weight: 600; }
  #bdt-root label:first-of-type { margin-top: 0; }

  #bdt-root input[type=text], #bdt-root input[type=number], #bdt-root input[type=time],
  #bdt-root select, #bdt-root textarea {
    width: 100%; padding: 10px 11px; border: 1.5px solid var(--line); border-radius: 3px;
    font-size: 15px; background: var(--paper); color: var(--ink); font-family: inherit;
  }
  #bdt-root input:focus, #bdt-root select:focus, #bdt-root textarea:focus { outline: none; border-color: var(--forest); background: #fff; }
  #bdt-root textarea { resize: vertical; min-height: 56px; }
  #bdt-root .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  #bdt-root .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; padding: 12px 14px; border-radius: 3px; border: none;
    font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 14px;
    font-family: inherit; letter-spacing: 0.01em;
  }
  #bdt-root .btn-primary { background: var(--forest); color: #fff; }
  #bdt-root .btn-primary:active { background: var(--forest-deep); }
  #bdt-root .btn-gold { background: var(--gold); color: #2b1f06; }
  #bdt-root .btn-outline-gold { background: transparent; color: var(--gold); border: 1.5px solid var(--gold); }
  #bdt-root .btn-ghost { background: transparent; color: var(--forest); border: 1.5px solid var(--forest); }
  #bdt-root .btn-danger-text { background: none; border: none; color: var(--brick); font-size: 12.5px; font-weight: 700; padding: 4px 0; margin: 0; width: auto; text-decoration: underline; cursor: pointer; }
  #bdt-root .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

  #bdt-root .odo-wrap { margin-top: 10px; }
  #bdt-root .odo { display: flex; gap: 3px; background: var(--forest-deep); padding: 8px 9px; border-radius: 4px; width: fit-content; }
  #bdt-root .odo .digit { width: 22px; height: 32px; background: #0c1911; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: var(--gold-soft); border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(0,0,0,0.4); }
  #bdt-root .odo .unit { color: #7fa88a; font-size: 10px; align-self: flex-end; margin: 0 2px 4px; }

  #bdt-root .photo-box { border: 1.5px dashed var(--line); border-radius: 3px; padding: 12px; text-align: center; margin-top: 10px; background: var(--paper); }
  #bdt-root .photo-box.has-photo { border-style: solid; border-color: var(--ok); padding: 8px; }
  #bdt-root .photo-box img { max-width: 100%; max-height: 160px; border-radius: 2px; display: block; margin: 0 auto 6px; }
  #bdt-root .photo-label { font-size: 13px; color: var(--forest); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  #bdt-root .photo-hint { font-size: 11px; color: #8a8874; margin-top: 4px; }
  #bdt-root input[type=file] { display: none; }

  #bdt-root .trecho { border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin-top: 10px; display: flex; gap: 10px; align-items: center; background: var(--paper); }
  #bdt-root .trecho img { width: 46px; height: 46px; object-fit: cover; border-radius: 2px; flex-shrink: 0; border: 1px solid var(--line); }
  #bdt-root .trecho .info { flex: 1; min-width: 0; }
  #bdt-root .trecho .route { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  #bdt-root .trecho .meta { font-size: 11.5px; color: #7a7a6a; margin-top: 1px; }
  #bdt-root .trecho .km { font-size: 12px; font-weight: 700; color: var(--forest); }

  #bdt-root .empty-note { font-size: 12.5px; color: #8a8874; text-align: center; padding: 10px 0; }

  #bdt-root .checklist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #bdt-root .chip { padding: 6px 10px; border-radius: 20px; border: 1.5px solid var(--line); font-size: 12px; cursor: pointer; user-select: none; background: var(--paper); color: #6b6a5e; font-weight: 600; }
  #bdt-root .chip.yes { background: #e7f0e6; border-color: var(--ok); color: var(--ok); }
  #bdt-root .chip.no { background: #f7e6e1; border-color: var(--brick); color: var(--brick); }

  #bdt-root .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  #bdt-root .summary-item { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 10px; }
  #bdt-root .summary-item .label { font-size: 10.5px; color: #8a8874; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin: 0; }
  #bdt-root .summary-item .value { font-size: 19px; font-weight: 700; color: var(--forest); margin-top: 2px; }

  #bdt-root .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--forest-deep); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 50; opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 90%; text-align: center; }
  #bdt-root .toast.show { opacity: 1; }

  #bdt-root .note-banner { font-size: 11.5px; color: #6b6a5e; background: #eee9d8; border-radius: 3px; padding: 8px 10px; margin: 0 16px 12px; border-left: 3px solid var(--gold); }
  #bdt-root .stamp-note { font-size: 11px; color: var(--ok); margin-top: 6px; font-weight: 600; }
  #bdt-root .ai-note { font-size: 11.5px; margin-top: 6px; font-weight: 600; display: none; align-items: flex-start; gap: 5px; line-height: 1.4; }
  #bdt-root .ai-note.reading { display: flex; color: #8a7a3a; align-items: center; }
  #bdt-root .ai-note.ok { display: flex; color: var(--ok); }
  #bdt-root .ai-note.fail { display: flex; color: var(--brick); }
  #bdt-root .spin { width: 11px; height: 11px; border: 2px solid #d8d3c2; border-top-color: var(--gold); border-radius: 50%; animation: bdtspin 0.7s linear infinite; }
  @keyframes bdtspin { to { transform: rotate(360deg); } }
</style>

  const CHECKLIST_ITEMS = [
    'BRAT', 'Triângulo', 'Macaco', 'Chave de roda', 'Estepe',
    'Documento do veículo', 'Aferição dos pneus', 'Cartão de abastecimento',
    'Nível de água OK', 'Nível de óleo OK'
  ];

  let state = {
    plate: '', model: '', driverName: '', driverReg: '',
    kmInicial: '', kmInicialPhoto: null, kmInicialStamp: '',
    trechos: [],
    trechoAberto: null, // trecho iniciado mas ainda não concluído: { origem, horaSaida, odometroInicial, foto, stamp }
    checklist: {}, checklistMode: null, obs: '', fuel: ''
  };

  const vehicles = [{ plate: 'TTV-4J54', model: 'Fiat Cronos' }];

  // Cache local (só neste navegador) de nome, matrícula e última placa usada —
  // conveniência de preenchimento, não é fonte de dados do boletim (isso vai pro banco).
  const LS_KEYS = { driverName: 'bdt:driverName', driverReg: 'bdt:driverReg', lastPlate: 'bdt:lastPlate', trechoAberto: 'bdt:trechoAberto' };
  function lsGet(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
  function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  // Mapeia os rótulos do checklist (usados na tela e no PDF) para as chaves
  // snake_case do JSONB no banco (ver bdt_schema.sql).
  const CHECKLIST_KEY_MAP = {
    'BRAT': 'brat', 'Triângulo': 'triangulo', 'Macaco': 'macaco',
    'Chave de roda': 'chave_roda', 'Estepe': 'estepe',
    'Documento do veículo': 'documento_veiculo', 'Aferição dos pneus': 'afericao_pneus',
    'Cartão de abastecimento': 'cartao_abastecimento', 'Nível de água OK': 'nivel_agua',
    'Nível de óleo OK': 'nivel_oleo'
  };
  const CHECKLIST_KEY_MAP_REV = Object.fromEntries(
    Object.entries(CHECKLIST_KEY_MAP).map(([label, key]) => [key, label])
  );

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    root.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2400);
  }

  // O boletim agora é gravado no Neon (via /api/bdts) só quando o motorista
  // conclui e gera o PDF — não existe mais rascunho persistido campo a campo.
  // save()/load() ficam como no-ops para não precisar tocar em cada
  // chamador espalhado pelo attachEvents().
  async function save() {}
  async function load(plate) {}

  // Grava o boletim do dia + trechos no banco (Neon), via /api/bdts.
  // Lança erro se a gravação falhar — quem chama decide como avisar o usuário.
  async function enviarBDT() {
    const checklist = state.checklistMode === 'ok'
      ? Object.fromEntries(CHECKLIST_ITEMS.map(item => [CHECKLIST_KEY_MAP[item], true]))
      : Object.fromEntries(
          Object.entries(state.checklist).map(([item, v]) => [CHECKLIST_KEY_MAP[item] || item, v])
        );

    const bdt = {
      data: todayISO,
      placa: state.plate,
      modelo: state.model,
      responsavel: state.driverName || null,
      motorista_nome: state.driverName,
      matricula: state.driverReg || null,
      km_inicial: state.kmInicial === '' ? null : Number(state.kmInicial),
      km_final: state.trechos.length ? lastOdometro() : null,
      abastecimento_litros: state.fuel === '' ? null : Number(state.fuel),
      ocorrencias: state.obs || null,
      checklist_alterado: state.checklistMode === 'custom',
      checklist,
      origem: 'web'
    };
    const trechos = state.trechos.map((t, i) => ({
      ordem: i + 1,
      local_partida: t.origem,
      local_chegada: t.destino,
      hora_partida: t.horaSaida || null,
      hora_chegada: t.horaChegada || null,
      odometro: t.odometro === '' ? null : Number(t.odometro)
    }));

    const resp = await fetch('/api/bdts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bdt, trechos })
    });
    let data;
    try { data = await resp.json(); }
    catch { throw new Error('HTTP ' + resp.status + ' — resposta inesperada'); }
    if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
    return data;
  }

  // Abre um editor de recorte/zoom sobre a foto escolhida, para o motorista enquadrar
  // o visor do odômetro antes de salvar. Retorna a foto final (já carimbada com data/hora),
  // usada tanto para guardar quanto para a leitura automática — ou null se cancelado.
  function abrirCropper(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const frameW = Math.min(320, window.innerWidth - 48);
          const frameH = Math.round(frameW * 0.62);

          const overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,15,10,0.95);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;';
          overlay.innerHTML = `
            <p style="color:#e7d3a4;font-size:13px;font-weight:700;margin-bottom:12px;text-align:center;max-width:${frameW}px;">Arraste e ajuste o zoom até o visor do odômetro ficar nítido</p>
            <div id="crop-frame" style="width:${frameW}px;height:${frameH}px;overflow:hidden;position:relative;border:2px solid #b98a2e;border-radius:4px;touch-action:none;background:#000;cursor:grab;">
              <img id="crop-img" draggable="false" style="position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;">
            </div>
            <div style="display:flex;align-items:center;gap:8px;width:${frameW}px;margin-top:14px;">
              <span style="color:#9fae9f;font-size:15px;">－</span>
              <input type="range" id="crop-zoom" min="0" max="100" value="0" style="flex:1;">
              <span style="color:#9fae9f;font-size:17px;">＋</span>
            </div>
            <div style="display:flex;gap:10px;margin-top:16px;width:${frameW}px;">
              <button id="crop-cancel" style="flex:1;padding:11px;border:1.5px solid #cfc9b3;background:transparent;color:#e7e3d3;border-radius:3px;font-weight:700;font-size:14px;">Cancelar</button>
              <button id="crop-ok" style="flex:1;padding:11px;border:none;background:#b98a2e;color:#2b1f06;border-radius:3px;font-weight:700;font-size:14px;">Usar esta foto</button>
            </div>
          `;
          document.body.appendChild(overlay);

          const frame = overlay.querySelector('#crop-frame');
          const imEl = overlay.querySelector('#crop-img');
          imEl.src = img.src;
          imEl.style.width = img.width + 'px';
          imEl.style.height = img.height + 'px';

          const coverScale = Math.max(frameW / img.width, frameH / img.height);
          const maxScale = coverScale * 5;
          let scale = coverScale;
          let tx = (frameW - img.width * scale) / 2;
          let ty = (frameH - img.height * scale) / 2;

          function clamp() {
            const w = img.width * scale, h = img.height * scale;
            tx = Math.min(0, Math.max(frameW - w, tx));
            ty = Math.min(0, Math.max(frameH - h, ty));
          }
          function apply() { imEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
          apply();

          overlay.querySelector('#crop-zoom').addEventListener('input', (ev) => {
            const t = ev.target.value / 100;
            const newScale = coverScale + t * (maxScale - coverScale);
            const cx = frameW / 2, cy = frameH / 2;
            const imgCx = (cx - tx) / scale, imgCy = (cy - ty) / scale;
            scale = newScale;
            tx = cx - imgCx * scale; ty = cy - imgCy * scale;
            clamp(); apply();
          });

          let dragging = false, lastX = 0, lastY = 0;
          frame.addEventListener('pointerdown', (ev) => {
            dragging = true; lastX = ev.clientX; lastY = ev.clientY;
            frame.setPointerCapture(ev.pointerId); frame.style.cursor = 'grabbing';
          });
          frame.addEventListener('pointermove', (ev) => {
            if (!dragging) return;
            tx += ev.clientX - lastX; ty += ev.clientY - lastY;
            lastX = ev.clientX; lastY = ev.clientY;
            clamp(); apply();
          });
          const stopDrag = () => { dragging = false; frame.style.cursor = 'grab'; };
          frame.addEventListener('pointerup', stopDrag);
          frame.addEventListener('pointercancel', stopDrag);

          overlay.querySelector('#crop-cancel').addEventListener('click', () => { overlay.remove(); resolve(null); });
          overlay.querySelector('#crop-ok').addEventListener('click', () => {
            const outW = 960, outH = Math.round(outW * frameH / frameW);
            const canvas = document.createElement('canvas');
            canvas.width = outW; canvas.height = outH;
            const ctx = canvas.getContext('2d');
            const sx = -tx / scale, sy = -ty / scale, sw = frameW / scale, sh = frameH / scale;
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);

            const now = new Date();
            const stamp = now.toLocaleDateString('pt-BR') + '  ' + now.toTimeString().slice(0, 8);
            const barH = Math.round(outH * 0.09);
            ctx.fillStyle = 'rgba(10,15,10,0.72)';
            ctx.fillRect(0, outH - barH, outW, barH);
            ctx.fillStyle = '#f2d896';
            ctx.font = `${Math.round(barH * 0.55)}px monospace`;
            ctx.textBaseline = 'middle';
            ctx.fillText(stamp, 10, outH - barH / 2);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            overlay.remove();
            resolve({ dataUrl, stamp, hhmm: now.toTimeString().slice(0, 5) });
          });
        };
        img.onerror = () => resolve(null);
        img.src = e.target.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }

  // Envia a foto (variante em alta resolução) para leitura automática do odômetro,
  // via o endpoint /api/ler-odometro (backend chama a IA — a chave nunca fica no navegador).
  // Retorna { digits } com a leitura, ou { digits: null } se não conseguir ler com segurança.
  async function lerOdometroIA(dataUrlAlta) {
    let response;
    try {
      response = await fetch('/api/ler-odometro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrlAlta })
      });
    } catch (networkErr) {
      console.error('Falha de rede ao chamar a API:', networkErr);
      throw new Error('rede: ' + networkErr.message);
    }

    let data;
    try {
      data = await response.json();
    } catch (parseErr) {
      console.error('Resposta não é JSON. status=' + response.status);
      throw new Error('HTTP ' + response.status + ' — resposta inesperada');
    }

    if (!response.ok) {
      console.error('Erro HTTP', response.status, data);
      throw new Error(data.error || ('HTTP ' + response.status));
    }

    if (data.ilegivel || !data.leitura) return { digits: null };
    return { digits: data.leitura };
  }

  function setAiNote(id, state_, msg) {
    const el = root.querySelector('#' + id);
    if (!el) return;
    el.className = 'ai-note ' + state_;
    el.innerHTML = state_ === 'reading' ? `<span class="spin"></span> ${msg}` : msg;
  }

  function odometerDigits(value, size = 6) {
    const str = (value === '' || value === null || value === undefined ? '' : String(value)).padStart(size, ' ');
    let html = '<div class="odo">';
    // Espaço em branco vira um traço visível (senão as caixinhas ficam todas escuras e sem
    // nenhum dígito, parecendo uma tarja preta sólida em vez de um odômetro vazio).
    for (const ch of str) html += `<div class="digit">${ch === ' ' ? '–' : ch}</div>`;
    html += '<span class="unit">km</span></div>';
    return html;
  }

  function lastOdometro() {
    if (state.trechos.length) return Number(state.trechos[state.trechos.length - 1].odometro) || 0;
    return Number(state.kmInicial) || 0;
  }
  function kmPercorrido() {
    const diff = (Number(lastOdometro()) || 0) - (Number(state.kmInicial) || 0);
    return diff > 0 ? diff : 0;
  }
  function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

                <div class="info">

              </div>`).join('')}
        </div>

        <div class="card">
          <h2>Checklist obrigatório</h2>

            <button class="btn ${state.checklistMode === 'custom' ? 'btn-primary' : 'btn-ghost'}" id="btn-check-custom" style="margin-top:0;">Sim, houve alteração</button>
          </div>
          ${state.checklistMode === 'custom' ? `
            <p class="photo-hint" style="margin-top:10px;">Marque cada item:</p>
            <div class="checklist">
              ${CHECKLIST_ITEMS.map(item => {
                const val = state.checklist[item];
                const cls = val === true ? 'yes' : val === false ? 'no' : '';
                const label = val === true ? '✓ ' + item : val === false ? '✕ ' + item : item;
                return `<div class="chip ${cls}" data-check="${escapeHtml(item)}">${label}</div>`;
              }).join('')}
            </div>` : ''}
          ${state.checklistMode === 'ok' ? '<p class="stamp-note">✓ Todos os itens marcados como OK</p>' : ''}
        </div>

        <div class="card">
          <h2>Encerramento do dia</h2>
          <div class="summary-grid">

            <div class="summary-item"><p class="label">Km final</p><p class="value">${state.trechos.length ? lastOdometro() : '—'}</p></div>
            <div class="summary-item"><p class="label">Km percorrido</p><p class="value">${kmPercorrido() || '—'}</p></div>
            <div class="summary-item"><p class="label">Abastecimento</p><p class="value">${state.fuel || '—'} L</p></div>

        <div class="card">

          <p class="photo-hint">Reúne todos os boletins salvos deste veículo no mês escolhido, em planilha (trechos dia a dia + resumo mensal).</p>

    attachEvents();

  function renderPhotoBox(photoData, inputId, stamp) {
    if (photoData) {
      return `
        <div class="photo-box has-photo">
          <img src="${photoData}">
          <label class="photo-label" for="${inputId}">↻ Trocar foto do odômetro</label>
          <input type="file" id="${inputId}" accept="image/*">
          <div class="stamp-note">✓ carimbo: ${stamp}</div>
        </div>`;
    }
    return `
      <div class="photo-box">
        <label class="photo-label" for="${inputId}">📷 Tirar foto ou escolher da galeria</label>
        <input type="file" id="${inputId}" accept="image/*">
        <p class="photo-hint">Opcional — se anexada, a data e a hora são carimbadas automaticamente</p>
      </div>`;
  }

  let pendingInicioFoto = null;
  let pendingInicioStamp = '';
  let pendingFimFoto = null;
  let pendingFimStamp = '';

  function attachEvents() {
    root.querySelector('#f-plate').addEventListener('change', async (e) => {
      state.plate = e.target.value;
      const v = vehicles.find(v => v.plate === state.plate);
      state.model = v ? v.model : '';
      lsSet(LS_KEYS.lastPlate, state.plate);
      await load(state.plate);
      render();
    });
    if (!state.plate && vehicles.length) { state.plate = vehicles[0].plate; state.model = vehicles[0].model; }

    root.querySelector('#f-driver').addEventListener('input', (e) => { state.driverName = e.target.value; });
    root.querySelector('#f-driver').addEventListener('blur', () => { lsSet(LS_KEYS.driverName, state.driverName); save(); });
    root.querySelector('#f-reg').addEventListener('input', (e) => { state.driverReg = e.target.value; });
    root.querySelector('#f-reg').addEventListener('blur', () => { lsSet(LS_KEYS.driverReg, state.driverReg); save(); });

    root.querySelector('#f-km-inicial').addEventListener('input', (e) => { state.kmInicial = e.target.value; });
    root.querySelector('#f-km-inicial').addEventListener('blur', save);

    const kmInicialPhotoInput = root.querySelector('#foto-km-inicial');
    if (kmInicialPhotoInput) {
      kmInicialPhotoInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const resultado = await abrirCropper(file);
        e.target.value = '';
        if (!resultado) return; // cancelado no editor de recorte
        const { dataUrl, stamp } = resultado;
        state.kmInicialPhoto = dataUrl;
        state.kmInicialStamp = stamp;
        await save();
        render();
        toast('Foto do odômetro inicial salva');

        setAiNote('km-inicial-ai-note', 'reading', 'Lendo odômetro na foto…');
        try {
          const { digits } = await lerOdometroIA(dataUrl);
          if (digits) {
            state.kmInicial = digits;
            await save();
            render();
            setAiNote('km-inicial-ai-note', 'ok', `🤖 Lido automaticamente: ${digits} km — confira ou corrija antes de salvar`);
          } else {
            setAiNote('km-inicial-ai-note', 'fail', 'Não consegui ler com segurança — digite manualmente');
          }
        } catch (err) {
          console.error(err);
          setAiNote('km-inicial-ai-note', 'fail', 'Falha na leitura automática (' + err.message + ') — digite manualmente');
        }
      });
    }

    // ---------- Iniciar trecho (odômetro de saída, sem precisar do destino ainda) ----------
    const trechoInicioPhotoInput = root.querySelector('#foto-trecho-inicio');
    if (trechoInicioPhotoInput) {
      trechoInicioPhotoInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const resultado = await abrirCropper(file);
        e.target.value = '';
        if (!resultado) return; // cancelado no editor de recorte
        const { dataUrl, stamp } = resultado;
        pendingInicioFoto = dataUrl;
        pendingInicioStamp = stamp;
        const box = trechoInicioPhotoInput.closest('.photo-box');
        box.classList.add('has-photo');
        box.innerHTML = `<img src="${dataUrl}"><div class="stamp-note">✓ carimbo: ${stamp}</div>`;
        toast('Foto anexada');

        setAiNote('t-odometro-inicial-ai-note', 'reading', 'Lendo odômetro na foto…');
        try {
          const { digits } = await lerOdometroIA(dataUrl);
          if (digits) {
            const odoInput = root.querySelector('#t-odometro-inicial');
            if (odoInput) odoInput.value = digits;
            setAiNote('t-odometro-inicial-ai-note', 'ok', `🤖 Lido automaticamente: ${digits} km — confira ou corrija antes de salvar`);
          } else {
            setAiNote('t-odometro-inicial-ai-note', 'fail', 'Não consegui ler com segurança — digite manualmente');
          }
        } catch (err) {
          console.error(err);
          setAiNote('t-odometro-inicial-ai-note', 'fail', 'Falha na leitura automática (' + err.message + ') — digite manualmente');
        }
      });
    }

    const btnIniciarTrecho = root.querySelector('#btn-iniciar-trecho');
    if (btnIniciarTrecho) {
      btnIniciarTrecho.addEventListener('click', () => {
        const origem = root.querySelector('#t-origem').value.trim();
        const horaSaida = root.querySelector('#t-hora-saida').value;
        const odometroInicial = root.querySelector('#t-odometro-inicial').value;

        if (!origem) { toast('Preencha o local de partida'); return; }
        if (!odometroInicial) { toast('Informe a leitura do odômetro'); return; }

        state.trechoAberto = { origem, horaSaida, odometroInicial, foto: pendingInicioFoto, stamp: pendingInicioStamp };
        pendingInicioFoto = null; pendingInicioStamp = '';
        lsSet(LS_KEYS.trechoAberto, JSON.stringify(state.trechoAberto));
        render();
        toast('Trecho iniciado — conclua quando chegar ao destino');
      });
    }

    // ---------- Concluir trecho (destino, hora e odômetro de chegada) ----------
    const trechoFimPhotoInput = root.querySelector('#foto-trecho-fim');
    if (trechoFimPhotoInput) {
      trechoFimPhotoInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const resultado = await abrirCropper(file);
        e.target.value = '';
        if (!resultado) return; // cancelado no editor de recorte
        const { dataUrl, stamp, hhmm } = resultado;
        pendingFimFoto = dataUrl;
        pendingFimStamp = stamp;
        const box = trechoFimPhotoInput.closest('.photo-box');
        box.classList.add('has-photo');
        box.innerHTML = `<img src="${dataUrl}"><div class="stamp-note">✓ carimbo: ${stamp}</div>`;
        const horaChegadaInput = root.querySelector('#t-hora-chegada');
        if (horaChegadaInput) horaChegadaInput.value = hhmm; // preenche automaticamente, mas continua editável
        toast('Foto anexada — hora de chegada preenchida automaticamente');

        setAiNote('t-odometro-final-ai-note', 'reading', 'Lendo odômetro na foto…');
        try {
          const { digits } = await lerOdometroIA(dataUrl);
          if (digits) {
            const odoInput = root.querySelector('#t-odometro-final');
            if (odoInput) odoInput.value = digits;
            setAiNote('t-odometro-final-ai-note', 'ok', `🤖 Lido automaticamente: ${digits} km — confira ou corrija antes de salvar`);
          } else {
            setAiNote('t-odometro-final-ai-note', 'fail', 'Não consegui ler com segurança — digite manualmente');
          }
        } catch (err) {
          console.error(err);
          setAiNote('t-odometro-final-ai-note', 'fail', 'Falha na leitura automática (' + err.message + ') — digite manualmente');
        }
      });
    }

    const btnCancelarTrecho = root.querySelector('#btn-cancelar-trecho');
    if (btnCancelarTrecho) {
      btnCancelarTrecho.addEventListener('click', () => {
        state.trechoAberto = null;
        localStorage.removeItem(LS_KEYS.trechoAberto);
        pendingFimFoto = null; pendingFimStamp = '';
        render();
      });
    }

    const btnConcluirTrecho = root.querySelector('#btn-concluir-trecho');
    if (btnConcluirTrecho) {
      btnConcluirTrecho.addEventListener('click', async () => {
        const destino = root.querySelector('#t-destino').value.trim();
        const horaChegada = root.querySelector('#t-hora-chegada').value;
        const odometro = root.querySelector('#t-odometro-final').value;

        if (!destino) { toast('Preencha o local de chegada'); return; }
        if (!odometro) { toast('Informe a leitura do odômetro'); return; }

        state.trechos.push({
          origem: state.trechoAberto.origem,
          destino,
          horaSaida: state.trechoAberto.horaSaida,
          horaChegada,
          odometroInicial: state.trechoAberto.odometroInicial,
          odometro,
          fotoPartida: state.trechoAberto.foto || null,
          stampPartida: state.trechoAberto.stamp || '',
          fotoChegada: pendingFimFoto,
          stampChegada: pendingFimStamp
        });
        state.trechoAberto = null;
        localStorage.removeItem(LS_KEYS.trechoAberto);
        pendingFimFoto = null; pendingFimStamp = '';
        await save();
        render();
        toast('Trecho concluído e adicionado ao boletim');
      });
    }

    root.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        state.trechos.splice(Number(btn.getAttribute('data-remove')), 1);
        await save(); render();
      });
    });

    root.querySelector('#btn-check-ok').addEventListener('click', async () => {
      state.checklistMode = 'ok';
      CHECKLIST_ITEMS.forEach(item => { state.checklist[item] = true; });
      await save(); render();
    });
    root.querySelector('#btn-check-custom').addEventListener('click', async () => {
      state.checklistMode = 'custom';
      await save(); render();
    });

    root.querySelectorAll('[data-check]').forEach(chip => {
      chip.addEventListener('click', async () => {
        const item = chip.getAttribute('data-check');
        const cur = state.checklist[item];
        state.checklist[item] = cur === true ? false : cur === false ? undefined : true;
        if (state.checklist[item] === undefined) delete state.checklist[item];
        await save(); render();
      });
    });

    root.querySelector('#f-fuel').addEventListener('input', (e) => { state.fuel = e.target.value; });
    root.querySelector('#f-fuel').addEventListener('blur', save);
    root.querySelector('#f-obs').addEventListener('input', (e) => { state.obs = e.target.value; });
    root.querySelector('#f-obs').addEventListener('blur', save);

    root.querySelector('#btn-pdf').addEventListener('click', async () => {
      if (!state.kmInicial) { toast('Informe o odômetro inicial do dia'); return; }
      if (state.trechoAberto) { toast('Conclua o trecho em andamento antes de gerar o PDF'); return; }
      if (state.trechos.length === 0) { toast('Registre pelo menos um trecho'); return; }
      if (!state.checklistMode) { toast('Responda se houve alteração no checklist'); return; }
      if (state.checklistMode === 'custom') {
        const pendentes = CHECKLIST_ITEMS.filter(i => state.checklist[i] === undefined);
        if (pendentes.length) { toast(`Checklist incompleto: ${pendentes.length} item(ns) pendente(s)`); return; }
      }
      const btn = root.querySelector('#btn-pdf');
      const textoOriginal = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Salvando…';
      try {
        await enviarBDT();
        toast('Boletim salvo no sistema');
        gerarPDF();
      } catch (err) {
        console.error(err);
        toast('Não foi possível salvar o boletim (' + err.message + ') — tente novamente');
      } finally {
        btn.disabled = false;
        btn.textContent = textoOriginal;
      }
    });

    root.querySelector('#btn-excel').addEventListener('click', () => {
      const mes = root.querySelector('#f-mes-relatorio').value;
      if (!mes) { toast('Escolha o mês de referência'); return; }
      gerarRelatorioMensal(mes);
    });
  }

  // ---------- Geração do PDF no layout do BDT oficial ----------
  function gerarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const M = 12, PW = 297, CW = PW - 2 * M;
    const colW = [50.2, 50.2, 28.5, 28.5, 43.5, 72.0]; // Partida, Chegada, HoraP, HoraC, Odômetro, Assinatura
    const colX = [M]; for (let i = 0; i < colW.length - 1; i++) colX.push(colX[i] + colW[i]);

    doc.setDrawColor(28, 56, 41); doc.setLineWidth(0.3);

    // Logo
    const logoW = 40, logoH = 33;
    doc.rect(M, M, 46, 38);
    try { doc.addImage(LOGO_B64, 'PNG', M + 3, M + 2.5, logoW, logoH); } catch (e) {}

    // Título
    doc.rect(M + 46, M, CW - 46, 18);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text('Boletim Diário de Trânsito - BDT', M + 46 + (CW - 46) / 2, M + 8, { align: 'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    doc.text('Campos preenchidos pelo motorista — gerado digitalmente', M + 46 + (CW - 46) / 2, M + 14.5, { align: 'center' });

    // Data / Placa / Modelo
    doc.rect(M + 46, M + 18, CW - 46, 10);
    doc.setFontSize(10); doc.setFont('helvetica', 'bold');
    doc.text('Data:', M + 50, M + 24.5);
    doc.text('Placa:', M + 100, M + 24.5);
    doc.text('Modelo:', M + 150, M + 24.5);
    doc.setFont('helvetica', 'normal');
    doc.text(todayBR, M + 60, M + 24.5);
    doc.text(state.plate, M + 112, M + 24.5);
    doc.text(state.model, M + 165, M + 24.5);

    // Responsável
    doc.rect(M + 46, M + 28, CW - 46, 10);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    doc.text('Responsável pela utilização:', M + 50, M + 34.5);
    doc.setFont('helvetica', 'normal');
    doc.text(state.driverName || '—', M + 100, M + 34.5);

    // Cabeçalho da tabela
    let y = M + 38;
    const headers = ['LOCAL DA PARTIDA', 'LOCAL DA CHEGADA', 'HORA PARTIDA', 'HORA CHEGADA', 'ODÔMETRO', 'ASSINATURA'];
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
    headers.forEach((h, i) => {
      // Redefine a cor a cada célula: desenhar o texto muda a cor de preenchimento
      // internamente no jsPDF, então sem isso as colunas depois da 1ª saem pretas.
      doc.setFillColor(230, 227, 214);
      doc.rect(colX[i], y, colW[i], 7, 'FD');
      doc.text(h, colX[i] + colW[i] / 2, y + 4.6, { align: 'center' });
    });
    y += 7;

    // Linhas de dados (trechos) + linhas em branco até completar a grade
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const rowH = 7.2;
    const totalRows = Math.max(state.trechos.length, 8);
    for (let r = 0; r < totalRows; r++) {
      const t = state.trechos[r];
      headers.forEach((_, i) => doc.rect(colX[i], y, colW[i], rowH));
      if (t) {
        doc.text(t.origem, colX[0] + 2, y + 4.8);
        doc.text(t.destino, colX[1] + 2, y + 4.8);
        doc.text(t.horaSaida || '', colX[2] + colW[2] / 2, y + 4.8, { align: 'center' });
        doc.text(t.horaChegada || '', colX[3] + colW[3] / 2, y + 4.8, { align: 'center' });
        doc.text(String(t.odometro), colX[4] + colW[4] / 2, y + 4.8, { align: 'center' });
        // Assinatura deixada em branco propositalmente — reservada para assinatura digital.
      }
      y += rowH;
    }

    // Rodapé km
    const half = CW / 2;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.rect(M, y, half / 2, 7); doc.text('KM INICIAL', M + 2, y + 4.8);
    doc.setFillColor(255, 255, 255);
    doc.rect(M + half / 2, y, half / 2, 7, 'F');
    doc.setFont('helvetica', 'normal'); doc.text(String(state.kmInicial), M + half / 2 + 2, y + 4.8);
    doc.setFont('helvetica', 'bold');
    doc.rect(M + half, y, half / 2, 7); doc.text('KM PERCORRIDO', M + half + 2, y + 4.8);
    doc.setFont('helvetica', 'normal');
    doc.rect(M + half + half / 2, y, half / 2, 7); doc.text(String(kmPercorrido()), M + half + half / 2 + 2, y + 4.8);
    y += 7;
    doc.setFont('helvetica', 'bold');
    doc.rect(M, y, half / 2, 7); doc.text('KM FINAL', M + 2, y + 4.8);
    doc.setFont('helvetica', 'normal');
    doc.rect(M + half / 2, y, half / 2, 7); doc.text(String(lastOdometro()), M + half / 2 + 2, y + 4.8);
    doc.setFont('helvetica', 'bold');
    doc.rect(M + half, y, half / 2, 7); doc.text('ABASTECIMENTO (L)', M + half + 2, y + 4.8);
    doc.setFont('helvetica', 'normal');
    doc.rect(M + half + half / 2, y, half / 2, 7); doc.text(String(state.fuel || 0), M + half + half / 2 + 2, y + 4.8);
    y += 10;

    doc.setFont('helvetica', 'italic'); doc.setFontSize(7.5);
    doc.text('Obs¹: os veículos da frota oficial do Instituto Estadual do Ambiente somente poderão trafegar com o Boletim Diário de Trânsito.', M, y);

    // ---------- Página 2: motorista, ocorrências, checklist ----------
    doc.addPage();
    y = M;
    doc.setFillColor(230, 227, 214);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.rect(M, y, CW, 8, 'FD');
    doc.text('CAMPOS PREENCHIDOS PELO MOTORISTA', M + CW / 2, y + 5.5, { align: 'center' });
    y += 8;

    const leftW = 95, rightW = CW - leftW;
    const boxH = 36;
    doc.rect(M, y, leftW, boxH);
    doc.rect(M + leftW, y, rightW, boxH);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('NOME DO MOTORISTA:', M + 3, y + 7);
    doc.setFont('helvetica', 'normal'); doc.text(state.driverName || '—', M + 3, y + 13);
    doc.setFont('helvetica', 'bold'); doc.text('MATRÍCULA:', M + 3, y + 20);
    doc.setFont('helvetica', 'normal'); doc.text(state.driverReg || '—', M + 3, y + 26);
    doc.setFont('helvetica', 'bold'); doc.text('ASSINATURA:', M + 3, y + 33);
    doc.setLineWidth(0.2);
    doc.line(M + 32, y + 34, M + leftW - 3, y + 34); // linha em branco reservada para assinatura digital

    doc.setFont('helvetica', 'bold'); doc.text('OCORRÊNCIAS:', M + leftW + 3, y + 7);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    const obsLines = doc.splitTextToSize(state.obs || 'Nenhuma ocorrência registrada.', rightW - 6);
    doc.text(obsLines, M + leftW + 3, y + 13);
    y += boxH;

    doc.setFillColor(230, 227, 214);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.rect(M, y, CW, 8, 'FD');
    doc.text('ITENS OBRIGATÓRIOS PREENCHIDOS PELO MOTORISTA', M + CW / 2, y + 5.5, { align: 'center' });
    y += 8;

    const chkLeftW = 95, chkRowH = 6.8;
    const chkTop = y;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    CHECKLIST_ITEMS.forEach((item, i) => {
      const ry = y + i * chkRowH;
      doc.rect(M, ry, 58, chkRowH);
      doc.rect(M + 58, ry, 18.5, chkRowH);
      doc.rect(M + 76.5, ry, 18.5, chkRowH);
      doc.text(item, M + 2, ry + 4.6);
      const v = state.checklist[item];
      doc.text(v === true ? 'SIM (X)' : 'SIM ( )', M + 60, ry + 4.6);
      doc.text(v === false ? 'NÃO (X)' : 'NÃO ( )', M + 78.5, ry + 4.6);
    });
    doc.rect(M + chkLeftW, chkTop, rightW, chkRowH * CHECKLIST_ITEMS.length);
    doc.setFont('helvetica', 'bold'); doc.text('OBS:', M + chkLeftW + 3, chkTop + 6);
    y = chkTop + chkRowH * CHECKLIST_ITEMS.length + 8;

    doc.setFont('helvetica', 'italic'); doc.setFontSize(7.2);
    doc.text('Obs²: qualquer inobservância dos itens acima é de responsabilidade direta do condutor, sujeitando-se às penalidades cabíveis.', M, y);
    doc.text('Obs³: a cópia digitalizada de cada BDT deverá ser encaminhada ao Serviço de Controle de Frota conforme normativo interno.', M, y + 5);

    // ---------- Página 3: anexo fotográfico (comprovação, não é parte do modelo oficial) ----------
    const photos = [];
    if (state.kmInicialPhoto) photos.push({ label: 'Odômetro inicial do dia', foto: state.kmInicialPhoto, stamp: state.kmInicialStamp, valor: state.kmInicial });
    state.trechos.forEach(t => {
      if (t.fotoPartida) photos.push({ label: `${t.origem} → ${t.destino} (partida)`, foto: t.fotoPartida, stamp: t.stampPartida, valor: t.odometroInicial });
      if (t.fotoChegada) photos.push({ label: `${t.origem} → ${t.destino} (chegada)`, foto: t.fotoChegada, stamp: t.stampChegada, valor: t.odometro });
    });

    if (photos.length > 0) {
      doc.addPage();
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
      doc.text('Anexo — Fotos de comprovação do odômetro (data e hora carimbadas)', M, M + 3);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
      doc.text('Este anexo não faz parte do modelo oficial do BDT — é evidência complementar gerada pelo app.', M, M + 9);

      let px = M, py = M + 16, pw = 60, ph = 45, gap = 6, perRow = 4;
      photos.forEach((p, i) => {
        if (i > 0 && i % perRow === 0) { px = M; py += ph + 14; }
        if (py + ph + 14 > 210 - M) { doc.addPage(); px = M; py = M; }
        try { doc.addImage(p.foto, 'JPEG', px, py, pw, ph); } catch (e) {}
        doc.setFontSize(7.5); doc.setFont('helvetica', 'bold');
        doc.text(p.label, px, py + ph + 4, { maxWidth: pw });
        doc.setFont('helvetica', 'normal');
        doc.text(`${p.valor} km · ${p.stamp || ''}`, px, py + ph + 8, { maxWidth: pw });
        px += pw + gap;
      });
    }

    const fname = `BDT_${state.plate.replace(/[^A-Za-z0-9]/g, '')}_${todayISO}.pdf`;
    try {
      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('PDF gerado — verifique os downloads do navegador');
    } catch (e) {
      console.error(e);
      toast('Não foi possível gerar o PDF neste navegador');
    }
  }

  // ---------- Geração do relatório mensal em Excel ----------
  async function gerarRelatorioMensal(mes) {
    toast('Reunindo boletins do mês…');
    let rows;
    try {
      const resp = await fetch(`/api/bdts?placa=${encodeURIComponent(state.plate)}&mes=${encodeURIComponent(mes)}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
      rows = Array.isArray(data) ? data : [];
    } catch (e) {
      console.error(e);
      toast('Não foi possível acessar os boletins salvos');
      return;
    }

    if (rows.length === 0) {
      toast('Nenhum boletim salvo para este veículo neste mês');
      return;
    }

    // Traduz o formato do banco (colunas snake_case) de volta para o formato
    // que o restante desta função já sabia consumir (mesma forma do antigo state).
    const dias = rows.map(r => ({
      data: r.data,
      driverName: r.motorista_nome,
      driverReg: r.matricula,
      kmInicial: r.km_inicial,
      fuel: r.abastecimento_litros,
      obs: r.ocorrencias,
      checklistMode: r.checklist_alterado ? 'custom' : 'ok',
      checklist: Object.fromEntries(
        Object.entries(r.checklist || {}).map(([key, v]) => [CHECKLIST_KEY_MAP_REV[key] || key, v])
      ),
      trechos: (r.trechos || []).map(t => ({
        origem: t.local_partida,
        destino: t.local_chegada,
        horaSaida: (t.hora_partida || '').slice(0, 5),
        horaChegada: (t.hora_chegada || '').slice(0, 5),
        odometro: t.odometro
      }))
    }));

    const linhasTrechos = [];
    dias.forEach(d => {
      (d.trechos || []).forEach(t => {
        linhasTrechos.push({
          'Data': d.data,
          'Motorista': d.driverName || '',
          'Matrícula': d.driverReg || '',
          'Placa': state.plate,
          'Modelo': state.model,
          'Local Partida': t.origem,
          'Local Chegada': t.destino,
          'Hora Partida': t.horaSaida,
          'Hora Chegada': t.horaChegada,
          'Odômetro (km)': Number(t.odometro) || t.odometro,
          'Carimbo da foto': t.stamp || ''
        });
      });
    });

    let totalKm = 0, totalLitros = 0;
    const linhasResumo = dias.map(d => {
      const kmIni = Number(d.kmInicial) || 0;
      const kmFim = (d.trechos && d.trechos.length) ? (Number(d.trechos[d.trechos.length - 1].odometro) || 0) : kmIni;
      const kmPerc = kmFim - kmIni > 0 ? kmFim - kmIni : 0;
      totalKm += kmPerc;
      totalLitros += Number(d.fuel) || 0;
      let checklistTxt = 'Não informado';
      if (d.checklistMode === 'ok') checklistTxt = 'OK — sem alterações';
      else if (d.checklistMode === 'custom') {
        const alterados = Object.keys(d.checklist || {}).filter(k => d.checklist[k] === false);
        checklistTxt = alterados.length ? ('Alteração: ' + alterados.join(', ')) : 'Revisado, sem pendências';
      }
      return {
        'Data': d.data,
        'Motorista': d.driverName || '',
        'Placa': state.plate,
        'Km Inicial': kmIni || '',
        'Km Final': kmFim || '',
        'Km Percorrido': kmPerc || '',
        'Abastecimento (L)': Number(d.fuel) || 0,
        'Checklist': checklistTxt,
        'Ocorrências': d.obs || ''
      };
    });
    linhasResumo.push({
      'Data': 'TOTAL DO MÊS', 'Motorista': '', 'Placa': '', 'Km Inicial': '', 'Km Final': '',
      'Km Percorrido': totalKm, 'Abastecimento (L)': totalLitros, 'Checklist': '', 'Ocorrências': ''
    });

    try {
      const wb = XLSX.utils.book_new();
      const wsResumo = XLSX.utils.json_to_sheet(linhasResumo);
      wsResumo['!cols'] = [{ wch: 12 }, { wch: 20 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 14 }, { wch: 26 }, { wch: 30 }];
      XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo diário');

      const wsTrechos = XLSX.utils.json_to_sheet(linhasTrechos);
      wsTrechos['!cols'] = [{ wch: 12 }, { wch: 20 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 18 }, { wch: 18 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, wsTrechos, 'Trechos');

      const fname = `Relatorio_BDT_${state.plate.replace(/[^A-Za-z0-9]/g, '')}_${mes}.xlsx`;
      XLSX.writeFile(wb, fname);
      toast(`Relatório gerado — ${dias.length} dia(s) no mês`);
    } catch (e) {
      console.error(e);
      toast('Não foi possível gerar o Excel neste navegador');
    }
  }

  (async function init() {
    const cachedPlate = lsGet(LS_KEYS.lastPlate);
    const initialVehicle = vehicles.find(v => v.plate === cachedPlate) || vehicles[0];
    state.plate = initialVehicle.plate;
    state.model = initialVehicle.model;
    state.driverName = lsGet(LS_KEYS.driverName);
    state.driverReg = lsGet(LS_KEYS.driverReg);
    const savedTrechoAberto = lsGet(LS_KEYS.trechoAberto);
    if (savedTrechoAberto) {
      try { state.trechoAberto = JSON.parse(savedTrechoAberto); }
      catch (e) { state.trechoAberto = null; }
    }
    await load(state.plate);
    render();
  })();
})();
</script>
